<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KAIN & CO. Admin</title>
<link rel="stylesheet" href="css/admin.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head>
<body>
<div id="loginView" class="login-view"><form id="loginForm" class="login-card"><h1>KAIN <span>&</span> CO.</h1><h2>Admin Login</h2><p>Sign in with the admin account created in Firebase.</p><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button type="submit">Login</button><div id="loginError"></div></form></div>
<div id="dashboardView" class="dashboard hidden"><aside><h2>KAIN<span>&</span>CO.</h2><button class="tab active" data-tab="overview">📊 Dashboard</button><button class="tab" data-tab="reservations">📅 Reservations</button><button class="tab" data-tab="menu">🍽️ Menu Manager</button><a href="index.html">🌐 View Website</a><button id="logoutBtn">🚪 Logout</button></aside>
<main><header class="admin-header"><div><h1 id="pageTitle">Dashboard</h1><p id="adminEmail"></p></div></header>
<section id="overview" class="panel active"><div class="stats"><div class="stat"><span>Total Reservations</span><strong id="totalReservations">0</strong></div><div class="stat"><span>Pending</span><strong id="pendingReservations">0</strong></div><div class="stat"><span>Total Menu Items</span><strong id="totalMenu">0</strong></div></div><h2>Recent Reservations</h2><div id="recentReservations"></div></section>
<section id="reservations" class="panel"><h2>All Reservations</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Request</th><th>Status</th><th>Action</th></tr></thead><tbody id="reservationTable"></tbody></table></div></section>
<section id="menu" class="panel"><div class="menu-top"><h2>Menu Manager</h2><button id="addMenuBtn">+ Add Menu Item</button></div><div id="adminMenuList"></div></section>
</main></div>
<div id="menuModal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><h2 id="modalTitle">Add Menu Item</h2><form id="menuForm"><input id="menuName" placeholder="Dish Name" required><select id="menuCategory" required><option value="filipino">Filipino</option><option value="international">International</option></select><input id="menuPrice" type="number" min="0" placeholder="Price" required><input id="menuImage" type="url" placeholder="Image URL" required><textarea id="menuDescription" placeholder="Description" required></textarea><button type="submit">Save Menu Item</button></form></div></div>
<script type="module" src="js/admin.js"></script></body></html>
